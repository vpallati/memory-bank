name: M1 vault
on:
  pull_request:
  push:
    branches: [main, m1-backend]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run db:start
      - run: npm run build:local
      - run: npm run db:test
      - run: npm run test:local
      - if: always()
        run: npm run db:stop
